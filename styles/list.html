<!doctype html>
<meta charset="utf-8">
<title>list cover</title>
<body>
<script src="base.js"></script>
<script>
/* LIST — "5 lessons", "7 mistakes", a checklist. `items[]` stack as numbered
   rows: `text`, optional `sub`, optional `mark` ("check" | "cross"), and
   `redact: true` to black out an item's text: the one the reader has to open
   the post for. Motion: an ink bar walks the list, row by row, flipping each
   row to paper-on-ink as it passes; marks punch as their row lights, and a
   redacted bar shimmers. Frame 0 = every row at rest. ≤ 6 items × ≤ 6 words. */
const {el,text,fit,phase,ease,clamp,TAU}=CS, S=window.SPEC;
CS.run(()=>{
const W=S.width||1200, H=S.height||1200, M=64;
const C={bg:S.ground||"#FF6A4D",ink:S.ink||"#17110F",paper:S.paper||"#FFF4EC",soft:S.soft||"rgba(23,17,15,.66)",line:"rgba(23,17,15,.24)"};
C.accent=S.accent||C.paper;   /* title accent line + brand bar; paper stays the highlight's text colour */
const {svg,defs}=CS.setup(W,H,C.bg);

/* kicker + title (second line in paper) */
let y=M;
if(S.kicker){ y+=26; svg.appendChild(text(M,y,S.kicker,{fill:C.ink,"font-family":"JetBrains Mono","font-size":22,"font-weight":800,"letter-spacing":3})); y+=20; }
const TS=S.titleSize||70;
[S.title,S.titleAccent].filter(Boolean).forEach((ln,i)=>{ y+=TS*1.04;
  const t=text(M,y,ln,{fill:i?C.accent:C.ink,"font-family":"Space Grotesk","font-weight":700,"letter-spacing":-1.5,"data-g":"title"});
  svg.appendChild(t); fit(t,W-2*M,TS,36); });

/* rows */
const items=S.items||[], n=items.length;
const top=y+54, bot=H-(S.footnote?120:96), rh=Math.min(S.rowHeight||150,(bot-top)/Math.max(1,n));
const IS=S.itemSize||46, NUMW=S.numberWidth||150, markW=items.some(it=>it.mark)?80:0;
const bars=[];
const rows=items.map((it,i)=>{
  const ry=top+i*rh, mid=ry+rh/2, g=el("g",{}); svg.appendChild(g);
  if(i) g.appendChild(el("line",{x1:M,x2:W-M,y1:ry,y2:ry,stroke:C.line,"stroke-width":2}));
  /* the walking bar lives behind the row, clipped so it can wipe in from the left */
  const cp=el("clipPath",{id:"rc"+i}); const cr=el("rect",{x:M-24,y:ry+8,width:0,height:rh-16}); cp.appendChild(cr); defs.appendChild(cp);
  const hl=el("rect",{x:M-24,y:ry+8,width:W-2*M+48,height:rh-16,rx:14,fill:C.ink,"clip-path":`url(#rc${i})`}); g.appendChild(hl);
  const num=text(M,mid+Math.min(rh*.62,104)*.36,String(i+1).padStart(2,"0"),{fill:C.ink,"font-family":"Anton","font-size":Math.min(rh*.62,104),class:"free"}); g.appendChild(num);
  const tx=M+NUMW, maxW=W-M-tx-markW, hasSub=!!it.sub;
  const ty=hasSub?mid+IS*.08:mid+IS*.36;
  let label=null, red=null;
  if(it.redact){
    const probe=text(0,-99,it.text||"████████",{"font-family":"Space Grotesk","font-size":IS,"font-weight":700}); svg.appendChild(probe);
    const w=Math.min(maxW,probe.getComputedTextLength()); probe.remove();
    red=el("rect",{x:tx,y:ty-IS*.78,width:w,height:IS*.9,rx:6,fill:C.ink}); g.appendChild(red);
    const sh=el("rect",{x:tx,y:ty-IS*.78,width:90,height:IS*.9,fill:C.paper,opacity:0}); g.appendChild(sh);
    const rcp=el("clipPath",{id:"rd"+i}); rcp.appendChild(el("rect",{x:tx,y:ty-IS*.78,width:w,height:IS*.9,rx:6})); defs.appendChild(rcp);
    sh.setAttribute("clip-path",`url(#rd${i})`); red.sh=sh; red.w=w; bars.push({x:tx,y:ty-IS*.78,w,h:IS*.9,i});
  }else{
    label=text(tx,ty,it.text,{fill:C.ink,"font-family":"Space Grotesk","font-size":IS,"font-weight":700,"letter-spacing":-.5,"data-g":"row"+i});
    g.appendChild(label); fit(label,maxW,IS,26);
  }
  const sub=hasSub?text(tx,ty+42,it.sub,{fill:C.soft,"font-family":"Space Grotesk","font-size":26,"font-weight":500,"data-g":"row"+i}):null;
  if(sub){ g.appendChild(sub); fit(sub,maxW,26,16); }
  let mk=null;
  if(it.mark){ const mx=W-M-30; mk=el("g",{}); g.appendChild(mk);
    mk.innerHTML=it.mark==="cross"
      ?`<path d="M-20 -20L20 20M20 -20L-20 20" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round"/>`
      :`<path d="M-22 2L-6 18L24 -18" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>`;
    mk.pos=[mx,mid]; }
  return {cr,num,label,sub,red,mk};
});

if(S.footnote) svg.appendChild(text(M,H-44,S.footnote,{fill:C.ink,"font-family":"Instrument Serif","font-style":"italic","font-size":34}));
CS.brand(svg,S,{fill:C.ink,bar:C.accent},W,H-44);

/* schedule: each row owns a slot in [.06,.92]; the bar wipes in, holds, wipes out */
const T0=.06, T1=.92, slot=(T1-T0)/Math.max(1,n);
window.setFrame=(f,total)=>{
  const t=f/total;
  rows.forEach((r,i)=>{
    const u=(t-T0-i*slot)/slot, live=u>=0&&u<1;
    const inn=ease.out(clamp(u/.2)), out=ease.inOut(clamp((u-.8)/.2));
    const w=live?(W-2*M+48)*inn:0, x0=live?(M-24)+(W-2*M+48)*out:M-24;
    r.cr.setAttribute("x",x0.toFixed(1)); r.cr.setAttribute("width",Math.max(0,w-(x0-(M-24))).toFixed(1));
    const on=live&&u>.1&&u<.9;
    r.num.setAttribute("fill",on?C.bg:C.ink);
    if(r.label) r.label.setAttribute("fill",on?C.paper:C.ink);
    if(r.sub) r.sub.setAttribute("fill",on?"rgba(255,244,236,.72)":C.soft);
    if(r.red){ r.red.setAttribute("fill",on?C.paper:C.ink);
      const s=phase(u,.25,.75); r.red.sh.setAttribute("x",(bars.find(b=>b.i===i).x-90+(r.red.w+90)*s).toFixed(1));
      r.red.sh.setAttribute("fill",on?C.ink:C.paper); r.red.sh.setAttribute("opacity",live&&s>0&&s<1?.55:0); }
    if(r.mk){ const p=clamp((u-.15)/.2), k=live?1+.4*Math.sin(Math.PI*p):1;
      r.mk.setAttribute("color",on?C.paper:C.ink);
      r.mk.setAttribute("transform",`translate(${r.mk.pos[0]} ${r.mk.pos[1]}) scale(${k.toFixed(3)})`); }
  });
};
});
</script>
