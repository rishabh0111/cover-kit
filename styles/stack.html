<!doctype html>
<meta charset="utf-8">
<title>stack cover</title>
<body>
<script src="base.js"></script>
<script src="brand-icons.js"></script>
<script>
/* STACK — a flagship project drawn as one green CI run: its stages
   (build → ship → run → prove) down a spine, each stage's jobs as white cards
   carrying the real logo of the tool, a stat strip under the board. Keys:
     title, titleAccent (second line, accent), optional kicker, footnote, brand
     lanes[]  ≤ 4 of { label, tiles: [{ brand, name? }] }, ≤ 4 tiles each;
              brand is a key of brand-icons.js, name overrides its title
     stats[]  ≤ 4 of { value, label }: the results the run proves
   Colours: ground (pine), ink, accent (running: title accent, spinner, the
   running card's outline). Passed is always green, as in every CI.
   Motion: frame 0 is the finished run, every job passed. The run resets to
   queued, then each job runs in order (accent outline, spinning badge) and
   passes (check pops) while queued cards wait dimmed; a stage's node checks off with its last job and the
   spine fills to the next stage; it ends all green again, which is frame 0.
   Use for the few posts that showcase a whole project, where the stack
   itself is the claim.                                                     */
const {el,text,fit,phase,ease,clamp}=CS, S=window.SPEC, B=window.BRANDS;
CS.run(()=>{
const W=S.width||1200, H=S.height||1200, M=64;
const C={bg:S.ground||"#0F2A23", ink:S.ink||"#FFFFFF", accent:S.accent||"#FFC94A",
         soft:"#9DB8AE", rule:"#2A4C42", card:"#FFFFFF", cardInk:"#0F2A23",
         pass:"#4ADE94", passCard:"#12A26A", queued:"#C9D2CE"};
const {svg}=CS.setup(W,H,C.bg);

/* kicker + title */
let y=M;
if(S.kicker){ y+=26; svg.appendChild(text(M,y,S.kicker,{fill:C.accent,"font-family":"JetBrains Mono","font-size":22,"font-weight":800,"letter-spacing":3})); y+=20; }
const TS=S.titleSize||66;
[S.title,S.titleAccent].filter(Boolean).forEach((ln,i)=>{ y+=TS*1.06;
  const t=text(M,y,ln,{fill:i?C.accent:C.ink,"font-family":"Space Grotesk","font-weight":700,"letter-spacing":-1.5,"data-g":"title"});
  svg.appendChild(t); fit(t,W-2*M,TS,34); });

/* the board: a stage column with the spine, then the job cards */
const lanes=(S.lanes||[]).slice(0,4), nL=lanes.length;
const stats=(S.stats||[]).slice(0,4), statH=stats.length?150:0;
const foot=S.footnote?118:92, top=y+58, bot=H-foot-statH-(statH?22:0);
const laneH=(bot-top)/Math.max(1,nL), tH=Math.min(132,laneH-30), GAP=18;
const SX=M+15, LBL=196, X0=M+LBL;
const laneY=lanes.map((_,i)=>top+laneH*(i+.5));

/* spine: a dashed track, and a solid fill that grows stage to stage */
if(nL>1) svg.appendChild(el("line",{x1:SX,x2:SX,y1:laneY[0],y2:laneY[nL-1],stroke:C.rule,"stroke-width":4,"stroke-dasharray":"2 10","stroke-linecap":"round"}));
const spine=el("line",{x1:SX,x2:SX,y1:laneY[0],y2:laneY[nL-1]||laneY[0],stroke:C.pass,"stroke-width":4,"stroke-linecap":"round"}); svg.appendChild(spine);

/* status marks, drawn around (0,0): a check, and a three-quarter arc that spins */
const CHECK="M-6.5 0.5L-2 5L7 -5";
const arc=r=>`M${r} 0A${r} ${r} 0 1 1 0 ${-r}`;

const jobs=[], stages=lanes.map((ln,li)=>{
  const cy=laneY[li], tiles=(ln.tiles||[]).slice(0,4), n=Math.max(1,tiles.length);
  /* stage node on the spine */
  const node=el("g",{transform:`translate(${SX} ${cy})`}); svg.appendChild(node);
  const ring=el("circle",{r:13,fill:C.bg,stroke:C.rule,"stroke-width":3}); node.appendChild(ring);
  const spin=el("path",{d:arc(13),fill:"none",stroke:C.accent,"stroke-width":4,"stroke-linecap":"round",opacity:0}); node.appendChild(spin);
  const done=el("g",{}); node.appendChild(done);
  done.appendChild(el("circle",{r:15,fill:C.pass}));
  done.appendChild(el("path",{d:CHECK,fill:"none",stroke:C.bg,"stroke-width":3.6,"stroke-linecap":"round","stroke-linejoin":"round"}));
  /* stage name and its job count */
  const name=text(SX+34,cy+2,String(ln.label||"").toUpperCase(),{fill:C.ink,"font-family":"JetBrains Mono","font-size":24,"font-weight":800,"letter-spacing":2,"data-g":"st"+li});
  svg.appendChild(name); fit(name,LBL-34-18,24,14);
  svg.appendChild(text(SX+34,cy+30,`${n} job${n>1?"s":""}`,{fill:C.soft,"font-family":"JetBrains Mono","font-size":17,"font-weight":700,"data-g":"st"+li}));
  /* job cards */
  const tW=(W-M-X0-GAP*(n-1))/n, ty=cy-tH/2;
  tiles.forEach((tl,ti)=>{
    const b=B[tl.brand]; if(!b) throw new Error("unknown brand "+tl.brand);
    const x=X0+ti*(tW+GAP), g=el("g",{}); svg.appendChild(g);
    /* the running outline sits outside the card, on the ground, where the accent reads */
    const run=el("rect",{x:x-6,y:ty-6,width:tW+12,height:tH+12,rx:20,fill:"none",stroke:C.accent,"stroke-width":5,opacity:0}); g.appendChild(run);
    g.appendChild(el("rect",{x,y:ty,width:tW,height:tH,rx:15,fill:C.card}));
    const L=Math.min(tH*.42,60), sz=b.title==="AWS"?L*1.3:L, lcy=ty+tH*.42;
    const logo=document.importNode(new DOMParser().parseFromString(b.svg,"image/svg+xml").documentElement,true);
    logo.setAttribute("x",x+tW/2-sz/2); logo.setAttribute("y",lcy-sz/2); logo.setAttribute("width",sz); logo.setAttribute("height",sz);
    logo.setAttribute("preserveAspectRatio","xMidYMid meet"); g.appendChild(logo);
    const nm=text(x+tW/2,ty+tH-17,tl.name||b.title,{fill:C.cardInk,"text-anchor":"middle","font-family":"Space Grotesk","font-size":21,"font-weight":700,"data-g":`j${li}${ti}`});
    g.appendChild(nm); fit(nm,tW-22,21,13);
    /* status badge, top right of the card: queued ring, spinner, or passed check */
    const badge=el("g",{transform:`translate(${x+tW-19} ${ty+19})`}); g.appendChild(badge);
    const bq=el("circle",{r:9,fill:"none",stroke:C.queued,"stroke-width":3,opacity:0}); badge.appendChild(bq);
    const bs=el("path",{d:arc(9),fill:"none",stroke:C.cardInk,"stroke-width":3.4,"stroke-linecap":"round",opacity:0}); badge.appendChild(bs);
    const bp=el("g",{}); badge.appendChild(bp);
    bp.appendChild(el("circle",{r:11,fill:C.passCard}));
    bp.appendChild(el("path",{d:CHECK,transform:"scale(.82)",fill:"none",stroke:"#FFFFFF","stroke-width":3.4,"stroke-linecap":"round","stroke-linejoin":"round"}));
    jobs.push({li,g,run,bq,bs,bp});
  });
  return {name,spin,done};
});

/* stat strip: what the run proves */
if(statH){ const sy=H-foot-statH, n=stats.length, cw=(W-2*M)/n;
  svg.appendChild(el("line",{x1:M,x2:W-M,y1:sy,y2:sy,stroke:C.rule,"stroke-width":2}));
  stats.forEach((st,i)=>{ const x=M+i*cw+(i?26:0);
    if(i) svg.appendChild(el("line",{x1:M+i*cw,x2:M+i*cw,y1:sy+30,y2:sy+statH-14,stroke:C.rule,"stroke-width":2}));
    const v=text(x,sy+96,st.value,{fill:C.ink,"font-family":"Anton","font-size":72,"data-g":"s"+i}); svg.appendChild(v); fit(v,cw-40,72,40);
    const l=text(x,sy+132,String(st.label).toUpperCase(),{fill:C.soft,"font-family":"JetBrains Mono","font-size":17,"font-weight":700,"letter-spacing":1,"data-g":"s"+i}); svg.appendChild(l); fit(l,cw-40,17,11); }); }

if(S.footnote) svg.appendChild(text(M,H-44,S.footnote,{fill:C.ink,"font-family":"Instrument Serif","font-style":"italic","font-size":34}));
CS.brand(svg,S,{fill:C.soft,bar:C.accent},W,H-44);

/* schedule: all passed until .05, back to queued over [.05,.11], the jobs run
   in order over [.14,.86], then all green to the loop, which is frame 0 */
const J=jobs.length, R0=.14, R1=.86, slot=(R1-R0)/Math.max(1,J);
jobs.forEach((j,k)=>{ j.a=R0+slot*k; j.b=j.a+slot*.9; });
stages.forEach((s,i)=>{ const own=jobs.filter(j=>j.li===i);
  s.a=own.length?own[0].a:R0; s.b=own.length?own[own.length-1].b:R0; });
const turn=(t,n)=>`rotate(${((t*n)%1*360).toFixed(1)})`;
window.setFrame=(f,total)=>{
  const t=f/total, run=t>=.11&&t<R1+.04;
  /* 0 = passed, 1 = queued; fades across the reset */
  const back=t<.05?0:t<.11?ease.inOut(phase(t,.05,.11)):0;
  jobs.forEach(j=>{
    const queued=back>0||(run&&t<j.a), running=run&&t>=j.a&&t<j.b, passed=!queued&&!running;
    const pop=run&&passed?ease.back(clamp((t-j.b)/.03)):1;
    j.bp.setAttribute("opacity",back>0?(1-back).toFixed(2):passed?1:0);
    j.bp.setAttribute("transform",`scale(${(passed?.3+.7*pop:1).toFixed(3)})`);
    j.bq.setAttribute("opacity",back>0?back.toFixed(2):queued?1:0);
    j.bs.setAttribute("opacity",running?1:0); j.bs.setAttribute("transform",turn(t,12));
    j.run.setAttribute("opacity",running?1:0);
    /* queued cards sit back, so the run reads as the board lighting up */
    j.g.setAttribute("opacity",back>0?(1-.5*back).toFixed(2):queued?.5:1);
  });
  stages.forEach(s=>{
    const waiting=back>0||(run&&t<s.a), running=run&&t>=s.a&&t<s.b, passed=!waiting&&!running;
    const pop=run&&passed?ease.back(clamp((t-s.b)/.035)):1;
    s.done.setAttribute("opacity",back>0?(1-back).toFixed(2):passed?1:0);
    s.done.setAttribute("transform",`scale(${(passed?.3+.7*pop:1).toFixed(3)})`);
    s.spin.setAttribute("opacity",running?1:0); s.spin.setAttribute("transform",turn(t,8));
    s.name.setAttribute("fill",running?C.accent:waiting?C.soft:C.ink);
  });
  /* the spine drains on reset, then fills one segment as each stage passes */
  let reach=nL-1;
  if(back>0) reach=(nL-1)*(1-back);
  else if(run) reach=stages.slice(0,-1).reduce((a,s)=>a+ease.inOut(phase(t,s.b,s.b+.04)),0);
  const span=laneY[nL-1]-laneY[0];
  spine.setAttribute("y2",(laneY[0]+(nL>1?span*reach/(nL-1):0)).toFixed(1));
};
});
</script>
